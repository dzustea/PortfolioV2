<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FL">
<!-- Značka webu: světlé FL s rudou tečkou na tmavé dlaždici.
     Písmena jsou obdélníky, ne text, takže nikde nechybí písmo
     a při 16 px zůstanou ostré. Uvnitř není skript ani odkaz ven. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff3048" stop-opacity=".30"/>
<stop offset=".62" stop-color="#ff3048" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="64" height="64" rx="14" fill="#0b0b0f"/>
<rect width="64" height="64" rx="14" fill="url(#g)"/>
<g fill="#f4f4f6">
<rect x="10" y="17" width="6" height="30"/>
<rect x="10" y="17" width="18" height="6"/>
<rect x="10" y="28" width="14" height="6"/>
<rect x="31" y="17" width="6" height="30"/>
<rect x="31" y="41" width="14" height="6"/>
</g>
<rect x="48" y="41" width="6" height="6" fill="#ff3048"/>
</svg>
